# Pre-commit checks for n8n workflows.
#
#   npx lefthook install
#
# Two things run, and neither asks a question: a hook that stops to prompt
# blocks the commit and gets uninstalled.
#
# `gen --check` writes nothing and fails when the committed cases no longer
# match the contracts; regenerating (`payload-contract gen`) is a deliberate act rather
# than something a hook does behind your back. `run` is the actual gate.
# Shape drift is reported by `capture` instead, and warns rather than failing,
# because a suite that fails on every legitimate edit gets regenerated unread.
pre-commit:
  parallel: true
  commands:
    cases-are-current:
      glob: '*.json'
      run: ./scripts/payload-contract.sh gen --check

    tests-pass:
      glob: '*.json'
      run: ./scripts/payload-contract.sh run
